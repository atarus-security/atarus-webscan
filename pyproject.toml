[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atarus-webscan"
version = "0.1.0"
description = "Web application security scanner by Atarus Offensive Security"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Atarus Offensive Security", email = "ops@atarussecurity.com" }]
license = { text = "MIT" }
keywords = ["security", "pentest", "web-scanner", "owasp", "vulnerability-scanner"]

dependencies = [
    "click>=8.0",
    "requests>=2.31",
    "rich>=13.0",
    "jinja2>=3.1",
    "weasyprint>=60.0",
]

[project.scripts]
atarus-webscan = "atarus_webscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atarus_webscan = ["templates/*.html"]
